<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Multiply Quest — The Fox's Journey</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Lilita+One&display=swap');

*{margin:0;padding:0;box-sizing:border-box}

:root{
  --bg:#0b1a0f;--card:rgba(20,40,25,0.85);--card2:rgba(30,55,35,0.8);
  --gold:#ffc857;--pink:#ff7eb3;--mint:#7cffcb;--sky:#7ec8e3;
  --text:#f0f7f0;--dim:#7a9a80;--correct:#7cffcb;--wrong:#ff6b7f;
}

body{
  font-family:'Fredoka',sans-serif;background:var(--bg);color:var(--text);
  min-height:100vh;overflow-x:hidden;
}

/* ============ SCENE CANVAS ============ */
.scene-wrap{
  position:relative;width:100%;max-width:560px;margin:0 auto;
  min-height:100vh;display:flex;flex-direction:column;
}

/* Sky gradient - changes per world */
.sky{
  position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;
  transition:background 1.5s ease;
}
.stars-bg{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0}

.content{position:relative;z-index:1;padding:12px 16px;flex:1;display:flex;flex-direction:column}

/* ============ TOP BAR ============ */
.top-bar{
  display:flex;justify-content:space-between;align-items:center;
  padding:8px 14px;background:var(--card);border-radius:16px;
  backdrop-filter:blur(10px);margin-bottom:10px;
}
.top-left{display:flex;align-items:center;gap:10px}
.fox-avatar{font-size:1.6em}
.world-name{font-family:'Lilita One',sans-serif;font-size:1.05em;color:var(--gold)}
.top-right{display:flex;gap:14px}
.stat-pill{display:flex;align-items:center;gap:4px;font-size:.85em;font-weight:600}
.stat-pill .emoji{font-size:1em}
.gem-count{color:var(--sky)}
.streak-count{color:var(--gold)}

/* ============ STORY PATH ============ */
.path-section{margin:8px 0 6px}
.path-bar{
  display:flex;align-items:center;gap:0;
  background:rgba(255,255,255,0.06);border-radius:20px;padding:6px 10px;
  position:relative;overflow:hidden;
}
.path-step{
  flex:1;height:10px;border-radius:5px;margin:0 2px;
  background:rgba(255,255,255,0.08);transition:all .5s ease;position:relative;
}
.path-step.done{background:var(--gold);box-shadow:0 0 8px rgba(255,200,87,0.4)}
.path-step.current{background:var(--mint);box-shadow:0 0 12px rgba(124,255,203,0.5);animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:.7}50%{opacity:1}}

.path-fox{
  position:absolute;top:-18px;font-size:1.4em;
  transition:left .8s cubic-bezier(.34,1.56,.64,1);z-index:2;
  filter:drop-shadow(0 2px 6px rgba(0,0,0,0.5));
}
.path-label{
  text-align:center;font-size:.7em;color:var(--dim);margin-top:4px;
  font-weight:600;letter-spacing:.5px;
}

/* ============ STORY CARD ============ */
.story-card{
  background:var(--card);backdrop-filter:blur(12px);
  border-radius:24px;padding:0;margin:8px 0;
  border:1px solid rgba(255,255,255,0.06);
  box-shadow:0 8px 40px rgba(0,0,0,0.4);overflow:hidden;
  animation:cardIn .5s ease;
}
@keyframes cardIn{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}

.scene-illustration{
  width:100%;height:180px;position:relative;overflow:hidden;
  display:flex;align-items:flex-end;justify-content:center;
}
.scene-illustration canvas{width:100%;height:100%}

/* Story text area */
.story-text-area{padding:18px 20px 10px}
.story-narrator{
  font-size:.95em;line-height:1.55;color:var(--text);
  min-height:50px;
}
.story-narrator .highlight{color:var(--gold);font-weight:700}
.story-narrator .character{color:var(--pink);font-weight:600}
.story-narrator .item{color:var(--mint);font-weight:600}

/* Character speech bubble */
.speech-bubble{
  background:rgba(255,255,255,0.08);border-radius:16px;
  padding:12px 16px;margin:10px 0 6px;position:relative;
  border-left:3px solid var(--pink);
}
.speech-who{font-size:.75em;color:var(--pink);font-weight:700;margin-bottom:4px}
.speech-text{font-size:.88em;color:var(--text);font-style:italic}

/* ============ QUESTION AREA ============ */
.question-area{padding:6px 20px 20px}
.q-prompt{
  font-family:'Lilita One',sans-serif;font-size:2.2em;
  text-align:center;margin:6px 0 14px;
  color:var(--text);text-shadow:0 2px 12px rgba(0,0,0,0.5);
}

/* Visual hint (cupcake groups) */
.visual-hint{
  display:none;flex-wrap:wrap;gap:8px;justify-content:center;
  margin:0 0 14px;padding:10px;background:rgba(255,255,255,0.04);border-radius:14px;
}
.visual-hint.show{display:flex}
.vh-group{
  background:rgba(255,255,255,0.05);border:1.5px dashed rgba(255,255,255,0.12);
  border-radius:10px;padding:6px 8px;display:flex;gap:3px;flex-wrap:wrap;justify-content:center;
}
.vh-item{font-size:1.1em}
.vh-label{width:100%;text-align:center;font-size:.65em;color:var(--dim);margin-top:6px}

.input-row{display:flex;justify-content:center;align-items:center;gap:10px}
.answer-input{
  width:120px;padding:12px;font-family:'Lilita One',sans-serif;font-size:1.8em;
  text-align:center;background:rgba(255,255,255,0.07);
  border:3px solid rgba(255,255,255,0.15);border-radius:16px;color:var(--text);
  outline:none;transition:all .3s;
}
.answer-input:focus{border-color:var(--gold);box-shadow:0 0 20px rgba(255,200,87,0.15)}
.answer-input.correct{border-color:var(--correct);background:rgba(124,255,203,0.08);box-shadow:0 0 24px rgba(124,255,203,0.2)}
.answer-input.wrong{border-color:var(--wrong);background:rgba(255,107,127,0.08);animation:shake .4s ease}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

.feedback-text{text-align:center;min-height:26px;margin-top:8px;font-weight:600;font-size:.95em}
.feedback-text.correct-fb{color:var(--correct)}
.feedback-text.wrong-fb{color:var(--wrong)}

.help-row{display:flex;gap:8px;justify-content:center;margin-top:8px}
.help-btn{
  padding:6px 14px;border-radius:10px;background:transparent;
  border:1.5px solid rgba(255,255,255,0.12);color:var(--dim);
  cursor:pointer;font-family:'Fredoka',sans-serif;font-size:.78em;
  font-weight:600;transition:all .2s;
}
.help-btn:hover{border-color:var(--sky);color:var(--sky)}
.hint-text{text-align:center;margin-top:6px;font-size:.82em;color:var(--sky);font-style:italic}

/* ============ CHAPTER COMPLETE ============ */
.chapter-complete{
  display:none;text-align:center;padding:30px 20px;
}
.chapter-complete.show{display:block;animation:cardIn .6s ease}
.ch-icon{font-size:3.5em;margin-bottom:10px}
.ch-title{font-family:'Lilita One',sans-serif;font-size:1.8em;color:var(--gold);margin-bottom:6px}
.ch-body{font-size:.92em;color:var(--text);line-height:1.5;margin-bottom:16px}
.ch-reward{
  display:inline-block;padding:8px 20px;background:rgba(255,200,87,0.12);
  border:2px solid var(--gold);border-radius:14px;margin-bottom:16px;
  font-weight:700;color:var(--gold);
}
.ch-next-btn{
  padding:14px 32px;border:none;border-radius:14px;cursor:pointer;
  font-family:'Lilita One',sans-serif;font-size:1.1em;
  background:linear-gradient(135deg,var(--gold),#e6a820);color:#1a1035;
  box-shadow:0 4px 20px rgba(255,200,87,0.3);transition:all .2s;
}
.ch-next-btn:hover{transform:translateY(-2px);box-shadow:0 6px 24px rgba(255,200,87,0.4)}

/* ============ MAP BUTTON ============ */
.map-btn{
  position:fixed;bottom:16px;right:16px;z-index:10;
  width:48px;height:48px;border-radius:50%;border:none;
  background:var(--card);backdrop-filter:blur(8px);
  font-size:1.4em;cursor:pointer;
  box-shadow:0 4px 16px rgba(0,0,0,0.4);transition:all .2s;
  border:2px solid rgba(255,255,255,0.1);
}
.map-btn:hover{transform:scale(1.1);border-color:var(--gold)}

/* ============ MUSIC BUTTON ============ */
.music-btn{
  position:fixed;bottom:16px;right:72px;z-index:10;
  width:48px;height:48px;border-radius:50%;border:none;
  background:var(--card);backdrop-filter:blur(8px);
  font-size:1.4em;cursor:pointer;
  box-shadow:0 4px 16px rgba(0,0,0,0.4);transition:all .2s;
  border:2px solid rgba(255,255,255,0.1);
}
.music-btn:hover{transform:scale(1.1);border-color:var(--gold)}
.music-btn.playing{border-color:var(--mint);box-shadow:0 4px 16px rgba(124,255,203,0.2)}
.music-btn .note-bars{
  display:flex;align-items:flex-end;justify-content:center;gap:2px;
  height:20px;width:24px;margin:0 auto;
}
.music-btn .note-bar{
  width:4px;border-radius:2px;background:var(--dim);
  transition:height .15s ease,background .3s;
}
.music-btn.playing .note-bar{background:var(--mint)}
.music-btn.playing .note-bar:nth-child(1){animation:eqBar 0.8s ease infinite}
.music-btn.playing .note-bar:nth-child(2){animation:eqBar 0.6s ease infinite 0.1s}
.music-btn.playing .note-bar:nth-child(3){animation:eqBar 0.7s ease infinite 0.2s}
.music-btn.playing .note-bar:nth-child(4){animation:eqBar 0.5s ease infinite 0.15s}
@keyframes eqBar{0%,100%{height:6px}50%{height:18px}}

/* ============ MAP OVERLAY ============ */
.map-overlay{
  position:fixed;top:0;left:0;width:100%;height:100%;z-index:20;
  background:rgba(0,0,0,0.85);backdrop-filter:blur(6px);
  display:none;align-items:center;justify-content:center;
}
.map-overlay.show{display:flex}
.map-content{
  width:90%;max-width:480px;max-height:85vh;overflow-y:auto;
  background:var(--card);border-radius:24px;padding:24px;
  border:1px solid rgba(255,255,255,0.08);animation:cardIn .4s ease;
}
.map-title{font-family:'Lilita One',sans-serif;font-size:1.4em;color:var(--gold);text-align:center;margin-bottom:16px}
.map-world{
  display:flex;align-items:center;gap:12px;padding:12px;
  border-radius:14px;margin:6px 0;cursor:pointer;transition:all .2s;
  border:2px solid transparent;
}
.map-world:hover{background:rgba(255,255,255,0.04)}
.map-world.current{border-color:var(--gold);background:rgba(255,200,87,0.06)}
.map-world.locked{opacity:.35;cursor:default}
.map-world.completed .mw-icon{position:relative}
.map-world.completed .mw-icon::after{content:'✓';position:absolute;bottom:-2px;right:-4px;font-size:.6em;color:var(--correct)}
.mw-icon{font-size:2em;width:48px;text-align:center}
.mw-info{flex:1}
.mw-name{font-weight:700;font-size:.95em}
.mw-desc{font-size:.72em;color:var(--dim);margin-top:2px}
.mw-stars{margin-top:3px;font-size:.8em}
.map-close{
  display:block;margin:16px auto 0;padding:10px 28px;border:none;border-radius:12px;
  background:rgba(255,255,255,0.08);color:var(--text);cursor:pointer;
  font-family:'Fredoka',sans-serif;font-size:.9em;font-weight:600;
}
.map-close:hover{background:rgba(255,255,255,0.14)}
.map-stats{text-align:center;margin-top:14px;padding-top:14px;border-top:1px solid rgba(255,255,255,0.06)}
.map-stats .ms-row{display:flex;justify-content:center;gap:20px;margin-top:6px}
.ms-item{text-align:center}
.ms-val{font-family:'Lilita One',sans-serif;font-size:1.3em}
.ms-label{font-size:.65em;color:var(--dim);text-transform:uppercase;letter-spacing:.5px}

/* Confetti */
.celebration{position:fixed;top:0;left:0;width:100%;height:100%;display:none;z-index:30;pointer-events:none}
.celebration.show{display:block}
.confetti-piece{position:absolute;border-radius:2px;animation:confFall 1.6s ease forwards}
@keyframes confFall{0%{transform:translateY(-100vh) rotate(0);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}

/* Items collected strip */
.items-collected{
  display:flex;gap:4px;flex-wrap:wrap;margin-top:6px;justify-content:center;
}
.collected-item{
  font-size:1.1em;animation:bounceIn .4s ease;
  filter:drop-shadow(0 1px 3px rgba(0,0,0,0.3));
}
@keyframes bounceIn{0%{transform:scale(0)}60%{transform:scale(1.3)}100%{transform:scale(1)}}

/* Reset link */
.reset-link{
  display:block;text-align:center;margin-top:12px;
  font-size:.72em;color:var(--dim);cursor:pointer;text-decoration:underline;
}
.reset-link:hover{color:var(--wrong)}

/* ============ FOX DEN ============ */
.den-btn{
  position:fixed;bottom:16px;right:128px;z-index:10;
  width:48px;height:48px;border-radius:50%;border:none;
  background:var(--card);backdrop-filter:blur(8px);
  font-size:1.4em;cursor:pointer;
  box-shadow:0 4px 16px rgba(0,0,0,0.4);transition:all .2s;
  border:2px solid rgba(255,255,255,0.1);
}
.den-btn:hover{transform:scale(1.1);border-color:var(--gold)}
.den-btn .den-notif{
  position:absolute;top:-2px;right:-2px;width:14px;height:14px;
  background:var(--pink);border-radius:50%;border:2px solid var(--bg);
  display:none;
}
.den-btn .den-notif.show{display:block;animation:pulse 1.5s infinite}

.den-overlay{
  position:fixed;top:0;left:0;width:100%;height:100%;z-index:20;
  background:rgba(0,0,0,0.88);backdrop-filter:blur(6px);
  display:none;overflow-y:auto;
}
.den-overlay.show{display:block}
.den-content{
  width:94%;max-width:520px;margin:16px auto;
  animation:cardIn .4s ease;
}
.den-header{
  display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;
}
.den-title{font-family:'Lilita One',sans-serif;font-size:1.3em;color:var(--gold)}
.den-gems{display:flex;align-items:center;gap:4px;font-weight:700;color:var(--sky)}
.den-close{
  padding:6px 16px;border:none;border-radius:10px;
  background:rgba(255,255,255,0.08);color:var(--text);cursor:pointer;
  font-family:'Fredoka',sans-serif;font-size:.85em;font-weight:600;
}
.den-close:hover{background:rgba(255,255,255,0.14)}

/* Room canvas */
.den-room{
  width:100%;border-radius:20px;overflow:hidden;
  background:var(--card);border:1px solid rgba(255,255,255,0.06);
  box-shadow:0 6px 30px rgba(0,0,0,0.4);
}
.den-room canvas{width:100%;display:block}

/* Visitor banner */
.den-visitor{
  background:rgba(255,179,71,0.1);border:1px solid rgba(255,179,71,0.2);
  border-radius:14px;padding:12px 16px;margin:10px 0;
  display:none;text-align:center;
}
.den-visitor.show{display:block;animation:cardIn .4s ease}
.den-visitor-text{font-size:.88em;color:var(--text)}
.den-visitor-who{font-weight:700;color:var(--gold)}

/* Tabs in den */
.den-tabs{display:flex;gap:6px;margin:10px 0}
.den-tab{
  flex:1;padding:8px;border-radius:10px;border:2px solid rgba(255,255,255,0.06);
  background:transparent;color:var(--dim);cursor:pointer;
  font-family:'Fredoka',sans-serif;font-size:.8em;font-weight:600;
  text-align:center;transition:all .2s;
}
.den-tab.active{border-color:var(--gold);color:var(--gold);background:rgba(255,179,71,0.08)}

/* Shop grid */
.den-shop{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
.shop-item{
  background:var(--card);border-radius:14px;padding:12px 8px;text-align:center;
  border:2px solid rgba(255,255,255,0.05);cursor:pointer;transition:all .2s;
}
.shop-item:hover{border-color:rgba(255,255,255,0.15);transform:translateY(-1px)}
.shop-item.owned{border-color:rgba(124,255,203,0.25);background:rgba(124,255,203,0.04)}
.shop-item.equipped{border-color:var(--gold);box-shadow:0 0 12px rgba(255,179,71,0.15)}
.shop-item.cant-afford{opacity:.4}
.shop-icon{font-size:2em;margin-bottom:4px}
.shop-name{font-size:.72em;font-weight:600}
.shop-price{font-size:.65em;color:var(--sky);margin-top:2px}
.shop-price.owned-label{color:var(--correct)}

/* Placed items list */
.den-placed{
  display:flex;flex-wrap:wrap;gap:6px;margin:8px 0;justify-content:center;
}
.placed-tag{
  padding:4px 10px;border-radius:8px;font-size:.75em;
  background:rgba(255,255,255,0.06);color:var(--text);
}

@media(max-width:480px){
  .q-prompt{font-size:1.8em}
  .answer-input{width:100px;font-size:1.5em}
  .scene-illustration{height:150px}
  .story-narrator{font-size:.88em}
  .den-shop{grid-template-columns:repeat(2,1fr)}
  .den-btn{right:120px}
}
</style>
</head>
<body>

<div class="scene-wrap">
  <div class="sky" id="sky"></div>
  <div class="stars-bg" id="starsBg"></div>
  <div class="content">
    <div class="top-bar">
      <div class="top-left">
        <div class="fox-avatar">🦊</div>
        <div class="world-name" id="worldName">Enchanted Forest</div>
      </div>
      <div class="top-right">
        <div class="stat-pill"><span class="emoji">💎</span><span class="gem-count" id="gemCount">0</span></div>
        <div class="stat-pill"><span class="emoji">🔥</span><span class="streak-count" id="streakCount">0</span></div>
      </div>
    </div>

    <div class="path-section">
      <div class="path-bar" id="pathBar"></div>
      <div class="path-label" id="pathLabel">Step 1 of 10</div>
    </div>

    <div class="story-card" id="storyCard">
      <div class="scene-illustration"><canvas id="sceneCanvas" width="560" height="180"></canvas></div>
      <div class="story-text-area">
        <div class="story-narrator" id="storyNarrator"></div>
        <div class="speech-bubble" id="speechBubble" style="display:none">
          <div class="speech-who" id="speechWho"></div>
          <div class="speech-text" id="speechText"></div>
        </div>
        <div class="items-collected" id="itemsCollected"></div>
      </div>
      <div class="question-area" id="questionArea">
        <div class="q-prompt" id="qPrompt">3 × 7</div>
        <div class="visual-hint" id="visualHint"></div>
        <div class="input-row">
          <input type="number" class="answer-input" id="answerInput" autocomplete="off" inputmode="numeric">
        </div>
        <div class="feedback-text" id="feedbackText"></div>
        <div class="help-row">
          <button class="help-btn" id="hintBtn">💡 Hint</button>
          <button class="help-btn" id="showBtn">👀 Show groups</button>
        </div>
        <div class="hint-text" id="hintText"></div>
      </div>
      <div class="chapter-complete" id="chapterComplete">
        <div class="ch-icon" id="chIcon">🏰</div>
        <div class="ch-title" id="chTitle">Chapter Complete!</div>
        <div class="ch-body" id="chBody"></div>
        <div class="ch-reward" id="chReward"></div><br>
        <button class="ch-next-btn" id="chNextBtn">Continue Journey →</button>
      </div>
    </div>
  </div>
</div>

<button class="map-btn" id="mapBtn">🗺️</button>
<button class="den-btn" id="denBtn" title="Fox Den">🏡<span class="den-notif" id="denNotif"></span></button>
<button class="music-btn" id="musicBtn" title="Toggle music">
  <div class="note-bars">
    <div class="note-bar" style="height:8px"></div>
    <div class="note-bar" style="height:14px"></div>
    <div class="note-bar" style="height:10px"></div>
    <div class="note-bar" style="height:16px"></div>
  </div>
</button>

<div class="den-overlay" id="denOverlay">
  <div class="den-content">
    <div class="den-header">
      <div class="den-title">🏡 Fox Den</div>
      <div class="den-gems">💎 <span id="denGems">0</span></div>
      <button class="den-close" id="denClose">Back to quest</button>
    </div>

    <div class="den-room" style="position:relative">
      <canvas id="denCanvas" width="520" height="320"></canvas>
      <div id="denEmojis" style="position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none"></div>
    </div>

    <div class="den-visitor" id="denVisitor">
      <div class="den-visitor-text">
        <span class="den-visitor-who" id="denVisitorWho"></span>
        <span id="denVisitorMsg"></span>
      </div>
    </div>

    <div class="den-tabs">
      <button class="den-tab active" data-dentab="furniture">🪑 Furniture</button>
      <button class="den-tab" data-dentab="deco">✨ Decor</button>
      <button class="den-tab" data-dentab="pets">🐾 Pets</button>
      <button class="den-tab" data-dentab="themes">🎨 Themes</button>
    </div>

    <div class="den-shop" id="denShop"></div>
  </div>
</div>

<div class="map-overlay" id="mapOverlay">
  <div class="map-content">
    <div class="map-title">🗺️ World Map</div>
    <div id="mapWorlds"></div>

const $=id=>document.getElementById(id);

// ======== INIT ========
render();

// ======== CORE RENDER ========
function render(){
  // Clamp world/step to valid bounds
  if(state.world>=WORLDS.length)state.world=WORLDS.length-1;
  if(state.step<0)state.step=0;

  const w=WORLDS[state.world];
  const step=state.step;

  // Sky
  $('sky').style.background=w.sky;
  $('worldName').textContent=w.name;

  // Stats
  $('gemCount').textContent=state.gems;
  $('streakCount').textContent=state.streak;

  // Path
  renderPath();

  // If chapter complete (check BEFORE accessing scene)
  if(step>=10){
    showChapterComplete();return;
  }

  const scene=w.scenes[step];
  if(!scene){showChapterComplete();return;}

  // Story
  $('questionArea').style.display='block';
  $('chapterComplete').classList.remove('show');

  $('storyNarrator').innerHTML=scene.narrator;

  if(scene.speech){
    $('speechBubble').style.display='block';
    $('speechWho').textContent=scene.speech.who;
    $('speechText').textContent=scene.speech.text;
  } else {
    $('speechBubble').style.display='none';
  }

  // Items collected so far this chapter
  renderItems();

  // Draw scene
  drawScene(scene.sceneType,step);

  // Generate question
  generateQuestion(w.tables);
  $('qPrompt').textContent=currentQ.a+' × '+currentQ.b;

  // Reset input
  resetInput();
}

function renderPath(){
  const bar=$('pathBar');
  bar.innerHTML='';
  const total=10;
  for(let i=0;i<total;i++){
    const s=document.createElement('div');
    s.className='path-step'+(i<state.step?' done':'')+(i===state.step?' current':'');
    bar.appendChild(s);
  }
  // Fox marker
  const fox=document.createElement('div');
  fox.className='path-fox';
  const pct=state.step>=10?96:(state.step/total*92+4);
  fox.style.left=pct+'%';
  fox.textContent='🦊';
  bar.appendChild(fox);

  $('pathLabel').textContent='Step '+(Math.min(state.step+1,10))+' of 10 — '+WORLDS[state.world].name;
}

function renderItems(){
  const c=$('itemsCollected');c.innerHTML='';
  const w=WORLDS[state.world];
  for(let i=0;i<state.step;i++){
    const item=w.scenes[i].item;
    if(item){const sp=document.createElement('span');sp.className='collected-item';sp.textContent=item;c.appendChild(sp)}
  }
}

function generateQuestion(tables){
  const table=tables[Math.floor(Math.random()*tables.length)];
  // Weighted toward weaker facts
  const weights=[];
  for(let i=1;i<=12;i++){
    const key=fk(table,i),d=state.facts[key];
    if(!d)weights.push({n:i,w:5});
    else{const r=d.correct/Math.max(d.attempts,1);weights.push({n:i,w:r>=.9&&d.attempts>=3?1:r>=.6?3:6})}
  }
  const total=weights.reduce((s,x)=>s+x.w,0);
  let r=Math.random()*total,pick=weights[0].n;
  for(const x of weights){r-=x.w;if(r<=0){pick=x.n;break}}
  currentQ={a:table,b:pick};
  if(Math.random()>.5){currentQ={a:pick,b:table}}
}

function resetInput(){
  hintUsed=false;awaitNext=false;
  $('answerInput').value='';$('answerInput').className='answer-input';$('answerInput').disabled=false;
  $('feedbackText').textContent='';$('feedbackText').className='feedback-text';
  $('hintText').textContent='';$('hintBtn').style.display='inline-block';$('showBtn').style.display='inline-block';
  $('visualHint').classList.remove('show');$('visualHint').innerHTML='';
  $('answerInput').focus();
}

// ======== ANSWER ========
$('answerInput').addEventListener('keydown',e=>{
  if(e.key==='Enter'){
    if(awaitNext)return;
    checkAnswer();
  }
});

function checkAnswer(){
  const val=parseInt($('answerInput').value);if(isNaN(val))return;
  const correct=currentQ.a*currentQ.b;
  const key=fk(currentQ.a,currentQ.b);
  if(!state.facts[key])state.facts[key]={correct:0,attempts:0};
  state.facts[key].attempts++;

  if(val===correct){
    state.facts[key].correct++;
    state.streak++;
    if(state.streak>state.bestStreak)state.bestStreak=state.streak;
    state.totalCorrect++;
    let gems=2+Math.floor(state.streak/3);if(hintUsed)gems=Math.max(1,Math.floor(gems/2));
    state.gems+=gems;
    $('answerInput').className='answer-input correct';
    const msgs=["Yes! 🎉","Got it! ⭐","Perfect! ✨","Amazing! 🚀","Brilliant! 💫"];
    $('feedbackText').textContent=msgs[Math.floor(Math.random()*msgs.length)]+' +'+gems+' 💎';
    $('feedbackText').className='feedback-text correct-fb';
    if(state.streak%5===0)showConfetti();
    playCorrectSfx();
    awaitNext=true;$('answerInput').disabled=true;

    // Advance story
    setTimeout(()=>{
      state.step++;
      // Collect item
      const scene=WORLDS[state.world].scenes[state.step-1];
      if(scene&&scene.item&&!state.collectedItems.includes(scene.item)){
        state.collectedItems.push(scene.item);
      }
      save();render();checkDenNotif();
    },1100);

  } else {
    state.streak=0;
    $('answerInput').className='answer-input wrong';
    const msgs=["Not quite!","Almost!","Try again!","Keep going!"];
    $('feedbackText').textContent=msgs[Math.floor(Math.random()*msgs.length)]+' The answer is '+correct;
    $('feedbackText').className='feedback-text wrong-fb';
    playWrongSfx();
    showVisualHint();
    awaitNext=true;$('answerInput').disabled=true;
    setTimeout(()=>{
      // Guard: if we've moved on (chapter complete, etc.), don't re-render question
      if(state.step>=10)return;
      generateQuestion(WORLDS[state.world].tables);
      $('qPrompt').textContent=currentQ.a+' × '+currentQ.b;
      resetInput();
    },2800);
  }
  save();
  $('gemCount').textContent=state.gems;
  $('streakCount').textContent=state.streak;
}

// ======== HINTS ========
$('hintBtn').addEventListener('click',()=>{
  if(hintUsed)return;hintUsed=true;$('hintBtn').style.display='none';
  $('hintText').innerHTML='💡 '+getStrategy(currentQ.a,currentQ.b);
});

$('showBtn').addEventListener('click',showVisualHint);

function showVisualHint(){
  if($('visualHint').classList.contains('show'))return;
  $('visualHint').classList.add('show');$('showBtn').style.display='none';hintUsed=true;
  const vh=$('visualHint');vh.innerHTML='';
  const a=currentQ.a,b=currentQ.b;
  const items=['🧁','⭐','🍎','🐱','🍪','🌸'];
  const emoji=items[Math.floor(Math.random()*items.length)];
  if(a*b<=60){
    for(let g=0;g<a;g++){
      const box=document.createElement('div');box.className='vh-group';
      for(let i=0;i<b;i++){const sp=document.createElement('span');sp.className='vh-item';sp.textContent=emoji;box.appendChild(sp)}
      vh.appendChild(box);
    }
    const lbl=document.createElement('div');lbl.className='vh-label';
    lbl.textContent=a+' groups of '+b+' '+emoji;vh.appendChild(lbl);
  } else {
    const lbl=document.createElement('div');lbl.className='vh-label';
    lbl.textContent='Think: '+a+' groups of '+b;vh.appendChild(lbl);
  }
}

function getStrategy(a,b){
  const sm=Math.min(a,b),lg=Math.max(a,b);
  if(sm===1)return 'Anything × <strong>1</strong> stays the same!';
  if(sm===2)return '<strong>Double it!</strong> '+lg+' + '+lg+' = <strong>'+(a*b)+'</strong>';
  if(sm===3)return '<strong>Triple:</strong> double '+lg+' = <strong>'+(lg*2)+'</strong>, plus '+lg+' more = <strong>'+(a*b)+'</strong>';
  if(sm===4)return '<strong>Double-double:</strong> '+lg+'→'+(lg*2)+'→<strong>'+(a*b)+'</strong>';
  if(sm===5)return '<strong>Count by 5s</strong> up to the '+lg+'th: <strong>'+(a*b)+'</strong>!';
  if(sm===6)return '<strong>Split it:</strong> 5×'+lg+' = '+(5*lg)+', plus 1×'+lg+' = '+lg+'. Total: <strong>'+(a*b)+'</strong>';
  if(sm===7)return '<strong>Split:</strong> 5×'+lg+' = '+(5*lg)+' + 2×'+lg+' = '+(2*lg)+' = <strong>'+(a*b)+'</strong>';
  if(sm===8)return '<strong>Double³:</strong> '+lg+'→'+(lg*2)+'→'+(lg*4)+'→<strong>'+(a*b)+'</strong>';
  if(sm===9)return '<strong>9s trick:</strong> '+lg+'×10 = '+(lg*10)+' minus '+lg+' = <strong>'+(a*b)+'</strong>';
  if(sm===10)return '<strong>Add a zero:</strong> <strong>'+(a*b)+'</strong>!';
  if(sm===11)return '<strong>11s:</strong> '+lg+'×10 + '+lg+' = '+(lg*10)+'+'+lg+' = <strong>'+(a*b)+'</strong>';
  if(sm===12)return '<strong>12s:</strong> '+lg+'×10 + '+lg+'×2 = '+(lg*10)+'+'+(lg*2)+' = <strong>'+(a*b)+'</strong>';
  return 'Break it into parts you know!';
}

function showChapterComplete(){
  $('questionArea').style.display='none';
  $('speechBubble').style.display='none';
  $('storyNarrator').innerHTML='';
  $('chapterComplete').classList.add('show');
  const w=WORLDS[state.world];
  $('chIcon').textContent=w.icon;
  $('chTitle').textContent=w.name+' Complete!';
    const endings=[
    'The party is legendary! Bunny says it\'s the best birthday AND the best surprise ever! 🎂',
    'Chef Bruno frames your recipe on the wall of fame! You\'re a baking LEGEND! 🧁',
    'They rename the race "The Fox Prix" in your honor! Fin McSpeed actually smiles! 🏊',
    'The ants build a tiny statue of you! It\'s the size of a pebble and absolutely adorable! 🐜',
    'Best sleepover in HISTORY! Boo becomes your permanent house ghost (but a friendly one)! 👻',
    'Waddles and you open a cloud restaurant together! Five stars — or rather, nine! 👨‍🍳',
    'The Misfits go on a world tour! First stop: every world you\'ve ever visited! 🎸',
    'Sgt. Whiskers sleeps on your bed every night now. The Goblin starts growing flowers instead. 🧸',
    'You get a pilot\'s license for ALL of space! Zorp visits every weekend! 🚀',
    'The book glows on your shelf forever. When you open it, your friends wave from the pages. 📖'
  ];
  $('chBody').innerHTML=(endings[state.world]||endings[0])+'<br><br>Items collected: '+state.collectedItems.slice(-10).join(' ');

    state.chapterBonuses.push(state.world);

  }
  showConfetti();

    $('chNextBtn').textContent='🎉 You finished the whole quest!';

  } else {
    $('chNextBtn').textContent='Continue to '+WORLDS[state.world+1].name+' →';
    $('chNextBtn').onclick=()=>{state.world++;state.step=0;save();render()};
  }
  renderItems();
}

// --- Drawing helpers ---
function drawGround(ctx,color,h){
  ctx.fillStyle=color;
  ctx.beginPath();ctx.moveTo(0,180-h);
  for(let x=0;x<=560;x+=40)ctx.quadraticCurveTo(x+20,180-h-8+Math.random()*16,x+40,180-h);
  ctx.lineTo(560,180);ctx.lineTo(0,180);ctx.fill();
}

function drawTree(ctx,x,h,color){
  ctx.fillStyle='#3d2b1a';ctx.fillRect(x-4,180-h,8,h*0.4);
  ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,180-h,h*0.35,0,Math.PI*2);ctx.fill();
  ctx.globalAlpha=0.6;
  ctx.fillStyle=color;
  ctx.beginPath();ctx.arc(x-h*0.15,180-h+h*0.1,h*0.25,0,Math.PI*2);ctx.fill();
  ctx.globalAlpha=1;
}

function drawMountain(ctx,x,w,h,color){
  ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(x,180);ctx.lineTo(x+w/2,180-h);ctx.lineTo(x+w,180);ctx.fill();
}

function drawStar(ctx,x,y,r,color){
  ctx.fillStyle=color;ctx.beginPath();
  for(let i=0;i<5;i++){
    const a=Math.PI/2+i*Math.PI*2/5;
    ctx.lineTo(x+Math.cos(a)*r,y-Math.sin(a)*r);
    const b=a+Math.PI/5;
    ctx.lineTo(x+Math.cos(b)*r*.4,y-Math.sin(b)*r*.4);
  }
  ctx.fill();
}

function drawCircleGlow(ctx,x,y,r,color){
  const g=ctx.createRadialGradient(x,y,0,x,y,r);
  g.addColorStop(0,color);g.addColorStop(1,'transparent');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
}

// ---- CAVE SCENES ----
function drawCave(ctx){
  ctx.fillStyle='#0d0a2e';ctx.fillRect(0,0,560,180);
  // Stalactites
  for(let i=0;i<10;i++){
    ctx.fillStyle='#2a2050';ctx.beginPath();
    const x=20+i*56;ctx.moveTo(x-10,0);ctx.lineTo(x,20+Math.random()*30);ctx.lineTo(x+10,0);ctx.fill();
  }
  // Crystals
  const crystalColors=['#a855f7','#6366f1','#8b5cf6','#c084fc'];
  const crystalGlows=['rgba(168,85,247,0.15)','rgba(99,102,241,0.15)','rgba(139,92,246,0.15)','rgba(192,132,252,0.15)'];
  for(let i=0;i<6;i++){
    ctx.fillStyle=crystalColors[i%crystalColors.length];
    const x=40+i*90+Math.random()*30,y=140+Math.random()*20;
    ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+5,y-20-Math.random()*15);ctx.lineTo(x+10,y);ctx.fill();
    drawCircleGlow(ctx,x+5,y-10,12,crystalGlows[i%crystalGlows.length]);
  }
  drawGround(ctx,'#1a1540',35);ctx.font='28px serif';ctx.fillText('🦊',260,155);
}

// ---- SKY SCENES ----
function drawSky(ctx){
  // Clouds
  for(let i=0;i<6;i++){
    ctx.fillStyle='rgba(255,255,255,'+(0.05+Math.random()*0.1)+')';
    const x=Math.random()*520,y=20+Math.random()*80;
    ctx.beginPath();ctx.arc(x,y,25,0,Math.PI*2);ctx.arc(x+20,y-5,20,0,Math.PI*2);ctx.arc(x+40,y,22,0,Math.PI*2);ctx.fill();
  }
  // Islands
  ctx.fillStyle='#4a8c5c';
  ctx.beginPath();ctx.ellipse(140,155,70,18,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#5a9c6c';
  ctx.beginPath();ctx.ellipse(400,140,80,20,0,0,Math.PI*2);ctx.fill();
  ctx.font='28px serif';ctx.fillText('🦊',120,150);
}
function drawSkyFlowers(ctx){drawSky(ctx);for(let i=0;i<7;i++){ctx.font='16px serif';ctx.fillText('🌺',70+i*60,140+Math.random()*10)}}
function drawSkySongbird(ctx){drawSky(ctx);ctx.font='24px serif';ctx.fillText('🐦',350,60)}
function drawSkyRainbow(ctx){
  drawSky(ctx);
  const colors=['#ff0000','#ff8800','#ffff00','#00cc00','#0066ff','#8800ff'];
  colors.forEach((c,i)=>{ctx.strokeStyle=c;ctx.lineWidth=3;ctx.globalAlpha=0.25;ctx.beginPath();ctx.arc(280,200,100+i*6,Math.PI,0);ctx.stroke()});
  ctx.globalAlpha=1;
}
function drawSkySheep(ctx){drawSky(ctx);for(let i=0;i<4;i++){ctx.font='20px serif';ctx.fillText('🐑',340+i*40,130+Math.random()*10)}}
function drawSkyPalace(ctx){
  drawSky(ctx);
  ctx.fillStyle='rgba(255,255,255,0.12)';

function buyOrEquip(item,tab){
  const owned=state.den.owned.includes(item.id);
  if(owned){
    if(tab==='themes'){
      state.den.theme=item.id;
      save();renderDen();renderDenShop();
    }
    return;
  }
  if(state.gems<item.price)return;
  state.gems-=item.price;
  state.den.owned.push(item.id);
  save();
  $('denGems').textContent=state.gems;
  $('gemCount').textContent=state.gems;
  renderDen();renderDenShop();
}

function renderDen(){
  const canvas=$('denCanvas');
  const ctx=canvas.getContext('2d');
  canvas.width=520;canvas.height=320;
  ctx.clearRect(0,0,520,320);

  // Get theme colors
  const themeId=state.den.theme||'th_forest';
  const themes=DEN_ITEMS.themes;
  const theme=themes.find(t=>t.id===themeId)||themes[0];

  // Background / ceiling
  ctx.fillStyle=theme.bg;
  ctx.fillRect(0,0,520,320);

  // Walls
  ctx.fillStyle=theme.wall;
  ctx.fillRect(0,0,520,200);

  // Warm wall gradient overlay for depth
  const wallGrad=ctx.createLinearGradient(0,0,0,200);
  wallGrad.addColorStop(0,'rgba(255,220,150,0.08)');
  wallGrad.addColorStop(1,'rgba(0,0,0,0.05)');
  ctx.fillStyle=wallGrad;
  ctx.fillRect(0,0,520,200);

  // Baseboard
  ctx.fillStyle='rgba(0,0,0,0.15)';
  ctx.fillRect(0,196,520,8);

  // Floor
  ctx.fillStyle=theme.floor;
  ctx.fillRect(0,200,520,120);

  // Floor planks with subtle highlight
  for(let y=210;y<320;y+=20){
    ctx.strokeStyle='rgba(0,0,0,0.08)';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(520,y);ctx.stroke();
    ctx.strokeStyle='rgba(255,255,255,0.04)';
    ctx.beginPath();ctx.moveTo(0,y+1);ctx.lineTo(520,y+1);ctx.stroke();
  }

  // Window — bright and cheerful
  // Window frame
  ctx.fillStyle='rgba(180,140,100,0.6)';
  ctx.fillRect(26,46,88,88);
  // Sky through window
  const skyGrad=ctx.createLinearGradient(30,50,30,130);
  skyGrad.addColorStop(0,'#88c8f8');
  skyGrad.addColorStop(1,'#c8e8ff');
  ctx.fillStyle=skyGrad;
  ctx.fillRect(30,50,80,80);
  // Sun glow
  ctx.fillStyle='rgba(255,240,180,0.5)';
  ctx.beginPath();ctx.arc(90,65,15,0,Math.PI*2);ctx.fill();
  // Window cross
  ctx.strokeStyle='rgba(180,140,100,0.7)';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(70,50);ctx.lineTo(70,130);ctx.stroke();
  ctx.beginPath();ctx.moveTo(30,90);ctx.lineTo(110,90);ctx.stroke();
  // Light beam from window
  ctx.fillStyle='rgba(255,240,200,0.04)';
  ctx.beginPath();ctx.moveTo(30,130);ctx.lineTo(0,320);ctx.lineTo(180,320);ctx.lineTo(110,130);ctx.fill();

  // Draw owned items as HTML emoji (NOT canvas — canvas emoji are washed out)
  const emojiLayer=$('denEmojis');
  emojiLayer.innerHTML='';
  const allPlaceable=[...DEN_ITEMS.furniture,...DEN_ITEMS.deco,...DEN_ITEMS.pets];
  const ownedItems=allPlaceable.filter(i=>state.den.owned.includes(i.id))
    .sort((a,b)=>a.y-b.y);

  // Canvas is 520x320 but displayed at 100% width — emoji positions use percentages
  function placeEmoji(icon,x,y,sz){
    const el=document.createElement('div');
    el.style.cssText='position:absolute;font-size:'+sz+'px;'
      +'left:'+(x/520*100)+'%;top:'+(y/520*100*520/320)+'%;'
      +'transform:translate(-50%,-50%);'
      +'filter:drop-shadow(0 2px 4px rgba(0,0,0,0.3));'
      +'line-height:1;';
    el.textContent=icon;
    emojiLayer.appendChild(el);
  }

  ownedItems.forEach(item=>{
    // Shadow on canvas
    ctx.fillStyle='rgba(0,0,0,0.12)';
    ctx.beginPath();
    ctx.ellipse(item.x,item.y+item.sz*0.4,item.sz*0.4,item.sz*0.12,0,0,Math.PI*2);
    ctx.fill();
    // Emoji as HTML
    placeEmoji(item.icon,item.x,item.y,item.sz);
  });

  // Fox always present
  ctx.fillStyle='rgba(0,0,0,0.1)';
  ctx.beginPath();ctx.ellipse(258,278,16,5,0,0,Math.PI*2);ctx.fill();
  placeEmoji('🦊',258,260,36);

  // Warm ambient light overlay
  const ambGrad=ctx.createRadialGradient(260,200,20,260,200,300);
  ambGrad.addColorStop(0,'rgba(255,220,150,0.06)');
  ambGrad.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=ambGrad;
  ctx.fillRect(0,0,520,320);

  // If no items, show a hint
  if(ownedItems.length===0){
    const hint=document.createElement('div');
    hint.style.cssText='position:absolute;bottom:12%;left:0;width:100%;text-align:center;'
      +'font-family:Fredoka,sans-serif;font-size:14px;color:rgba(255,255,255,0.5);pointer-events:none;';
    hint.textContent='Earn gems in quests to decorate your den!';
    emojiLayer.appendChild(hint);
  }
}

function ensureCtx(){
  if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==='suspended')audioCtx.resume();
  return audioCtx;
}

// Soft piano-like tone: sine + quiet overtone, fast attack, gentle decay
function playPianoNote(ctx,frequency,duration,volume,startTime){
  const t=startTime||ctx.currentTime;

  // Fundamental
  const osc=ctx.createOscillator();
  const g=ctx.createGain();
  osc.type='sine';
  osc.frequency.value=frequency;
  g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(volume,t+0.02);
  g.gain.exponentialRampToValueAtTime(volume*0.5,t+duration*0.3);
  g.gain.exponentialRampToValueAtTime(0.001,t+duration);
  osc.connect(g);g.connect(ctx.destination);
  osc.start(t);osc.stop(t+duration+0.05);

  // Soft overtone for warmth (octave above, very quiet)
  const osc2=ctx.createOscillator();
  const g2=ctx.createGain();
  osc2.type='sine';
  osc2.frequency.value=frequency*2;
  g2.gain.setValueAtTime(0,t);
  g2.gain.linearRampToValueAtTime(volume*0.12,t+0.02);
  g2.gain.exponentialRampToValueAtTime(0.001,t+duration*0.6);
  osc2.connect(g2);g2.connect(ctx.destination);
  osc2.start(t);osc2.stop(t+duration+0.05);
}

// Warm pad: very soft, slow-breathing sine chords
function startPad(ctx,freqs,gain){
  freqs.forEach((f,i)=>{
    const osc=ctx.createOscillator();
    const g=ctx.createGain();
    osc.type='sine';
    osc.frequency.value=f;
    g.gain.value=0;
    osc.connect(g);g.connect(ctx.destination);
    osc.start();
    // Gentle fade in
    g.gain.linearRampToValueAtTime(gain,ctx.currentTime+3+i*0.5);
    // Slow gentle breathing via LFO
    const lfo=ctx.createOscillator();
    const lfoG=ctx.createGain();
    lfo.type='sine';
    lfo.frequency.value=0.12+i*0.03;
    lfoG.gain.value=gain*0.3;
    lfo.connect(lfoG);lfoG.connect(g.gain);
    lfo.start();
    activeNodes.push({stop:()=>{
      g.gain.linearRampToValueAtTime(0,ctx.currentTime+1.5);
      setTimeout(()=>{try{osc.stop();lfo.stop()}catch(e){}},2000);
    }});
  });
}

function startWorldMusic(worldIdx){
  if(currentWorldMusic===worldIdx&&activeNodes.length>0)return;
  stopWorldMusic();
  currentWorldMusic=worldIdx;
  const ctx=ensureCtx();
  const t=THEMES[worldIdx]||THEMES[0];
  const beatMs=60/t.bpm*1000;

  // Warm pad
  startPad(ctx,t.pad,0.025);

  // Melody loop: piano-like notes
  let melIdx=0;
  function nextMel(){
    if(!musicPlaying)return;
    const note=t.melody[melIdx%t.melody.length];
    const f=NF[note];
    if(f){
      // Occasionally skip a note for gentle breathing
      if(Math.random()>0.12){
        playPianoNote(ctx,f,beatMs/1000*1.8,0.07);
      }
    }
    melIdx++;
    melTimer=setTimeout(nextMel,beatMs);
  }
  melTimer=setTimeout(nextMel,1500);

  // Gentle bass: soft low notes, half-time
  let bassIdx=0;
  function nextBass(){
    if(!musicPlaying)return;
    const note=t.bass[bassIdx%t.bass.length];
    const f=NF[note];
    if(f){
      playPianoNote(ctx,f,beatMs/1000*3.5,0.035);
    }
    bassIdx++;
    bassTimer=setTimeout(nextBass,beatMs*2);
  }
  bassTimer=setTimeout(nextBass,2500);

  // Twinkle texture: high quiet sparkles like distant wind chimes
  const sparkleNotes=[523.25,659.25,783.99,987.77,1046.50,1174.66,1318.51];
  function sparkle(){
    if(!musicPlaying)return;
    if(Math.random()>0.35){
      const f=sparkleNotes[Math.floor(Math.random()*sparkleNotes.length)];
      playPianoNote(ctx,f,1.2,0.015);
    }
    texTimer=setTimeout(sparkle,2000+Math.random()*3000);
  }
  texTimer=setTimeout(sparkle,4000);
}

function stopWorldMusic(){
  if(melTimer){clearTimeout(melTimer);melTimer=null}
  if(bassTimer){clearTimeout(bassTimer);bassTimer=null}
  if(texTimer){clearTimeout(texTimer);texTimer=null}
  activeNodes.forEach(n=>{try{n.stop()}catch(e){}});
  activeNodes=[];
  currentWorldMusic=-1;
}

// === SFX: warm and friendly ===
function playCorrectSfx(){
  if(!musicPlaying)return;
  try{
    const ctx=ensureCtx();
    // Happy ascending chime: C5 → E5 → G5
    playPianoNote(ctx,523.25,0.3,0.1);
    setTimeout(()=>playPianoNote(ctx,659.25,0.3,0.1),120);
    setTimeout(()=>playPianoNote(ctx,783.99,0.5,0.12),240);
  }catch(e){}
}

function playWrongSfx(){
  if(!musicPlaying)return;
  try{
    const ctx=ensureCtx();
    // Gentle "oops": two soft descending notes
    playPianoNote(ctx,392,0.25,0.06); // G4
    setTimeout(()=>playPianoNote(ctx,329.63,0.35,0.06),180); // E4
  }catch(e){}
}

function playChapterFanfare(){
  if(!musicPlaying)return;
  try{
    const ctx=ensureCtx();
    // Warm celebratory arpeggio
    const notes=[261.63,329.63,392,523.25,659.25,783.99,1046.50];
    notes.forEach((f,i)=>{
      setTimeout(()=>playPianoNote(ctx,f,0.8,0.09),i*150);
    });
    // Final warm chord
    setTimeout(()=>{
      [261.63,329.63,392,523.25].forEach(f=>playPianoNote(ctx,f,2.0,0.06));
    },notes.length*150+100);
  }catch(e){}
}

// Toggle button
$('musicBtn').addEventListener('click',()=>{
  ensureCtx();
  musicPlaying=!musicPlaying;
  $('musicBtn').classList.toggle('playing',musicPlaying);
  if(musicPlaying){
    startWorldMusic(state.world);
  }else{
    stopWorldMusic();
  }
});

// Auto-switch music when world changes
(function(){
  let lastWorld=-1;
  setInterval(()=>{
    if(musicPlaying&&state.world!==lastWorld){
      lastWorld=state.world;
      startWorldMusic(state.world);
    }
  },500);
})();
